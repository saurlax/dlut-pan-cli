name: Test and package
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal scripts)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go mod verify
      - name: Verify generated documentation
        shell: bash
        run: |
          go run ./scripts/docs
          test -z "$(git status --porcelain docs/commands)"
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build release archives
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: go run ./scripts/package -version "$BUILD_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
